# dsh-fuse bundle patch: mounts the Fuse plugin row into the web plugin roster.
# The row mounts BOTH halves:
#   - host side (index.mjs): 系统指令注册（dsh-fuse fence 语言 + 设计令牌 + 代码规范）
#                              + validate_fuse_spec 预检工具 + config API
#   - browser side (client.js): dsh-fuse fence 页面级渲染器 + 走查器 + 撤销历史
- insert:
    - id: fuse
      name: dsh-fuse
