name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      # v2 起仓库不再提交 package-lock.json（唯一 devDependency 是 jsdom），
      # 所以不能开 cache: npm，也不能用 npm ci —— 两者都要求 lockfile。
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 单元测试
        run: npm test

      - name: 打包预演（npm pack --dry-run）
        run: npm pack --dry-run
